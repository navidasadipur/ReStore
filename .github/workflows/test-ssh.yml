name: Test hosted runner SSH

on:
  workflow_dispatch:
    inputs:
      host:
        description: Server IP or hostname (no protocol)
        required: true
        default: '94.184.36.73'
        type: string
      port:
        description: SSH port
        required: true
        default: '22'
        type: string

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ inputs.host }}
      SSH_PORT: ${{ inputs.port }}
    steps:
      - name: Test network and SSH banner (no credentials needed)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time

          host = os.environ['SSH_HOST'].strip()
          port = int(os.environ['SSH_PORT'])
          if not host or host.startswith('-') or any(c.isspace() for c in host):
              sys.exit('Enter a plain server IP or hostname.')
          if not 1 <= port <= 65535:
              sys.exit('SSH port must be between 1 and 65535.')

          # Try three independent connections to distinguish a persistent block
          # from a single transient failure. Require an SSH protocol response.
          passed = 0
          for attempt in range(1, 4):
              try:
                  with socket.create_connection((host, port), timeout=10) as conn:
                      conn.settimeout(10)
                      conn.sendall(b'SSH-2.0-ReStoreConnectivityTest\r\n')
                      data = b''
                      deadline = time.monotonic() + 10
                      while len(data) < 8192:
                          conn.settimeout(max(0.1, deadline - time.monotonic()))
                          chunk = conn.recv(1024)
                          if not chunk:
                              break
                          data += chunk
                          if any(line.startswith(b'SSH-') for line in data.splitlines()):
                              passed += 1
                              print(f'Attempt {attempt}: SSH protocol response received.', flush=True)
                              break
                          if time.monotonic() >= deadline:
                              break
                      else:
                          pass
                      if not any(line.startswith(b'SSH-') for line in data.splitlines()):
                          raise RuntimeError('TCP connected, but no SSH protocol response received')
              except (OSError, RuntimeError) as exc:
                  print(f'Attempt {attempt}: {type(exc).__name__}: {exc}', flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### SSH network test\n\nSSH responses: {passed}/3 from a GitHub-hosted runner.\n\n')
              summary.write('This tests network reachability only; it does not authenticate or deploy.\n')
          if passed != 3:
              sys.exit('Network test failed or was intermittent. Inspect the attempts above.')
          PY

      - name: Check whether authentication test is configured
        id: auth
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$SSH_USER$SSH_PRIVATE_KEY$SSH_KNOWN_HOSTS" ]]; then
            echo 'Configure all three secrets: SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS.'
            exit 1
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Authentication skipped: add SSH_USER, SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS to test login.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test SSH login and deployment prerequisites (no restart)
        if: steps.auth.outputs.configured == 'true'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          timeout 90s ssh -F /dev/null -T -i "$key_dir/key" \
            -p "$SSH_PORT" -l "$SSH_USER" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo 'SSH authentication succeeded.'
          cd /opt/restore
          test -r .env
          docker info >/dev/null
          docker compose version
          docker compose config --quiet
          docker compose ps app
          echo 'Docker access and Compose configuration checks passed. No deployment performed.'
          REMOTE
          echo 'SSH login, Docker access, and /opt/restore Compose configuration: passed. Image pull and deployment remain untested.' >> "$GITHUB_STEP_SUMMARY"
