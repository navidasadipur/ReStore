name: Build and Push

# Builds the ReStore image on a GitHub-hosted runner and pushes it to GHCR.
#
# Why not build on the self-hosted runner on the server (the NavidAsadipurWebsite
# pattern)? ReStore compiles a React 18 + MUI app, and that webpack build needs
# more than 1 GB of heap. The VPS has 967 MB of RAM and 1 vCPU, so the build
# spends all its time in swap and eventually dies with "JavaScript heap out of
# memory". A hosted runner does it in a few minutes for free (public repo).
#
# The server then only pulls the finished image - see deploy/DEPLOY.md.

on:
  push:
    branches:
      - main
      - develop
      - deploy/docker-cicd
  workflow_dispatch:

env:
  IMAGE: ghcr.io/navidasadipur/restore
  DEPLOY_DIR: /opt/restore

# Serialize main builds through promotion. Do not cancel a running promotion.
# Other branches can cancel superseded builds. Ordering is not guaranteed, so
# promotion also checks that this commit is still the current main HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET for API and deployment tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build .NET 9 API
        run: dotnet build API/API.csproj --configuration Release

      - name: Test deployment agent
        run: dotnet test tools/ReStore.Deploy.Tests/ReStore.Deploy.Tests.csproj --configuration Release

      - name: Publish self-contained Linux deployment agent
        run: |
          dotnet publish tools/ReStore.Deploy/ReStore.Deploy.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/restore-deploy
          tar -C artifacts/restore-deploy -czf artifacts/restore-deploy-linux-x64.tar.gz .

      - name: Upload Linux deployment agent
        uses: actions/upload-artifact@v4
        with:
          name: restore-deploy-linux-x64
          path: artifacts/restore-deploy-linux-x64.tar.gz
          if-no-files-found: error

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "full=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.full }}
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache lives in GitHub Actions cache, so rebuilds only redo
          # the stages that actually changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile compiles the React client and publishes the API. There
      # are currently no application test suites; the agent tests run above.
      # Add future application test gates before promotion.
      - name: Publish production channel from current main only
        id: production
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; leaving production unchanged.'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Promote the exact build output; do not rebuild or resolve a SHA tag.
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:production" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:production"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        env:
          IMAGE_TAG: sha-${{ steps.vars.outputs.full }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PRODUCTION_PUBLISHED: ${{ steps.production.outputs.published }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "\`$IMAGE:$IMAGE_TAG\`"
            echo
            echo "Exact image: \`$IMAGE@$IMAGE_DIGEST\`"
            echo
            if [[ "$PRODUCTION_PUBLISHED" == 'true' ]]; then
              echo 'production and latest now reference this successful main build.'
            else
              echo 'production and latest were not changed by this run.'
            fi
            echo
            echo 'Build and publication succeeded; server deployment is separate.'
            echo
            echo "Deploy on the server with:"
            echo
            echo '```'
            echo "cd $DEPLOY_DIR"
            echo "export RESTORE_TAG=$IMAGE_TAG"
            echo "docker compose pull app && docker compose up -d app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Deployment will be initiated by a server-side systemd timer every 30
  # minutes. No SSH deployment or additional self-hosted runner is used here.
